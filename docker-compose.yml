services:
  postgres:
    image: postgres:18
    container_name: habitat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: habitat
      POSTGRES_USER: habitat_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitat_app -d habitat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - habitat_postgres_data:/var/lib/postgresql/data

volumes:
  habitat_postgres_data:
