packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # Pulled in by the OpenTelemetry OTLP exporters. Habitat exports over OTLP/HTTP
  # with JSON encoding, so protobufjs' postinstall CLI setup is never needed.
  protobufjs: false
  sharp: true
  unrs-resolver: true

overrides:
  postcss: 8.5.26
  sharp: 0.35.3
